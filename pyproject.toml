[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisgraph"
version = "0.1.0"
description = "Security decision contracts for guarded agent actions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pyjwt[crypto]>=2.9,<3",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "pyyaml>=6,<7",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.package-data]
aegisgraph = ["static/*"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["backend"]
testpaths = ["tests"]
markers = [
  "db: requires a reachable PostgreSQL (set AEGISGRAPH_TEST_DATABASE_URL); skipped cleanly when absent",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aegisgraph"]
mypy_path = "backend"
