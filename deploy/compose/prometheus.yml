# Prometheus scrape configuration for the local AegisGraph stack.
#
# Scrapes the OpenTelemetry Collector's Prometheus exporter. The API itself is
# not scraped here: `fastapi`/`uvicorn` expose no Prometheus endpoint, and adding
# a metrics library would be a new runtime dependency (explicitly out of scope
# for M4). When M2 adds instrumentation, add a scrape target for `api:8080`.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: aegisgraph-local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector's own internal telemetry (otelcol_* series) is on :8888.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
