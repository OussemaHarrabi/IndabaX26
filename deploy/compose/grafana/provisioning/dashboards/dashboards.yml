# Load every dashboard JSON from the mounted directory; the UI cannot mutate them.
apiVersion: 1

providers:
  - name: aegisgraph
    orgId: 1
    folder: AegisGraph
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
