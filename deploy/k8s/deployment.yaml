apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisgraph-api
  labels:
    app.kubernetes.io/name: aegisgraph
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: aegisgraph
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegisgraph
        app.kubernetes.io/component: api
    spec:
      # No Kubernetes API access is needed; keep the token out of the pod.
      automountServiceAccountToken: false
      # Pod-level security context: non-root, fixed uid/gid, RuntimeDefault seccomp.
      # This is the "restricted" Pod Security Admission profile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # kustomize (deploy/k8s/kustomization.yaml) rewrites this to the
          # registry + immutable digest recorded by CI. Do not add a floating
          # tag here.
          image: aegisgraph
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: aegisgraph-config
            # Values are NOT in this repository. The Secret must exist before
            # rollout so the pod fails closed rather than starting unconfigured
            # (see deploy/k8s/README.md for the creation command).
            - secretRef:
                name: aegisgraph-secrets
          # Container-level hardening (F10): no privilege escalation, a
          # read-only root filesystem, and every Linux capability dropped.
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            # The image is read-only; this is the only writable mount it gets.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aegisgraph
              app.kubernetes.io/component: api
