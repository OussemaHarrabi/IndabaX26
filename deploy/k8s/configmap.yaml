apiVersion: v1
kind: ConfigMap
metadata:
  name: aegisgraph-config
  labels:
    app.kubernetes.io/name: aegisgraph
    app.kubernetes.io/component: api
data:
  # Non-secret configuration only. Secrets (the database URL, the token verifier)
  # arrive through the `aegisgraph-secrets` Secret, which this repository does not
  # ship — see deploy/k8s/README.md for exactly what it must contain.
  #
  # --- production posture (H4-07) ---------------------------------------------
  # These three are set EXPLICITLY rather than left to defaults. With
  # AEGISGRAPH_ENV unset the process runs in `development`, where /metrics is
  # served by default and `auth_mode=none` is accepted — the opposite of the M3
  # posture ("off in production; a production process never exposes it by
  # accident"). `scripts/validate_k8s_manifests.py` asserts all three are present.
  AEGISGRAPH_ENV: "production"
  AEGISGRAPH_AUTH_MODE: "required"
  AEGISGRAPH_METRICS_ENABLED: "false"
  # Production refuses to start when the legacy unauthenticated surface is on, so
  # this is belt-and-braces with the validator.
  AEGISGRAPH_LEGACY_UNAUTHENTICATED: "false"
  AEGISGRAPH_LOG_LEVEL: "info"
  # --- telemetry (best-effort: the API must start when the collector is absent) --
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_SERVICE_NAME: "aegisgraph-api"
  OTEL_SDK_DISABLED: "false"
