# Keep at least one API replica serving during voluntary disruptions (node drains,
# cluster upgrades). With replicas: 2 this allows only one eviction at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aegisgraph-api
  labels:
    app.kubernetes.io/name: aegisgraph
    app.kubernetes.io/component: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aegisgraph
      app.kubernetes.io/component: api
