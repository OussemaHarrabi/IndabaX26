# AegisGraph CI.
#
# Five gates, each reproducible locally (see docs/ops/ci.md for the exact
# commands): static quality, security scanning, container build + hardened smoke,
# Kubernetes manifest validation, and Compose configuration validation.
#
# Actions are pinned to immutable commit SHAs (resolved 2026-10-08) with the
# human-readable version in a trailing comment, per the M4 rules.
#
# No matrix is used: the package declares `requires-python = ">=3.12,<3.13"`, so
# there is exactly one supported interpreter minor (3.12) to cover. A matrix of
# one would add cost without adding coverage; it can be introduced when the
# support range widens.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: aegisgraph:ci
  # Coverage floor is a ratchet: it may only move up, and any lowering requires a
  # written justification in the same commit.
  #
  # Baseline at commit 33f96cc (measured 2026-10-08, both on a local 3.13.14
  # interpreter and on python:3.12-slim): 988/1043 statements = 94.73 %. pytest-cov
  # prints that as a rounded "95 %", which is why the floor is 94 and not 95: a
  # floor of 95 fails on the real baseline by three statements. The M1 workstream
  # is adding substantive tests; when coverage clears 95 % the floor is raised.
  COVERAGE_FAIL_UNDER: "94"

jobs:
  quality:
    name: lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the shipped pins and the dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check backend tests scripts

      - name: mypy (strict)
        run: python -m mypy

      - name: pytest with coverage gate
        run: |
          python -m pytest -q \
            --cov=aegisgraph \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under="${COVERAGE_FAIL_UNDER}"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

  security:
    name: dependency and static security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scanning tools
        run: python -m pip install --upgrade pip pip-audit bandit

      - name: pip-audit against the shipped pins (F8-aware, version-pinned not hash-pinned)
        run: python -m pip_audit -r requirements.lock --strict --progress-spinner off

      - name: bandit static analysis (offline)
        run: python -m bandit -r backend -q --severity-level medium

  container:
    name: container build, hardening proof and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python (for the SBOM script)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # --provenance=false --sbom=false: BuildKit's default provenance/attestation
      # manifest records build metadata, so the manifest-list digest varies between
      # builds even when the content does not. Disabling both makes the recorded
      # digest the reproducible content digest.
      - name: Build the image
        run: docker buildx build --provenance=false --sbom=false --load -t "${IMAGE_NAME}" .

      - name: Record the image digest (build artifact)
        run: |
          mkdir -p artifacts
          docker image inspect --format '{{.Id}}' "${IMAGE_NAME}" | tee artifacts/image-digest.txt
          docker image inspect --format '{{json .RepoDigests}}' "${IMAGE_NAME}" | tee artifacts/image-repo-digests.json
          docker images "${IMAGE_NAME}" --digests --no-trunc | tee artifacts/image-listing.txt

      - name: Hardened smoke test (read-only root filesystem)
        run: |
          set -euo pipefail
          docker run --rm -d --name aegisgraph-smoke \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            -p 18080:8080 \
            "${IMAGE_NAME}"
          cleanup() { docker stop aegisgraph-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done

          health="$(curl -fsS http://127.0.0.1:18080/healthz)"
          test "${health}" = '{"status":"ok"}' || { echo "unexpected healthz: ${health}"; exit 1; }
          echo "healthz: ${health}"

          decision="$(curl -fsS -X POST http://127.0.0.1:18080/v1/decision \
            -H 'Content-Type: application/json' \
            --data-binary '{"run_id":"ci-smoke","step_id":1,"user_goal":"Perform the requested safe task","conversation":[],"candidate_action":{"type":"respond","content":"Done"},"policy_context":{"policy_id":"ci","policy_version":"1","allowed_tools":[],"confirmation_required_tools":[],"consequential_tools":[]},"history_digest":{"confirmations_granted":[]}}')"
          echo "decision: ${decision}"
          python - "${decision}" <<'PY'
          import json, sys
          body = json.loads(sys.argv[1])
          assert body["decision"] == "allow", body
          assert body["reason_codes"] == ["BENIGN_ACTION"], body
          print("decision asserted: allow / BENIGN_ACTION")
          PY

      - name: Hardening proof (non-root, no writable application code, no toolchain)
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "${IMAGE_NAME}" -c '
            test "$(id -u)" = "10001" || { echo "not running as uid 10001"; exit 1; }
            test "$(stat -c %U /app)" = "root" || { echo "/app is not root-owned"; exit 1; }
            touch /app/breach 2>/dev/null && { echo "F10 REGRESSION: /app is writable"; exit 1; }
            touch /app/backend/aegisgraph/breach.py 2>/dev/null && { echo "F10 REGRESSION"; exit 1; }
            command -v pip >/dev/null 2>&1 && { echo "pip present in runtime image"; exit 1; }
            command -v gcc >/dev/null 2>&1 && { echo "compiler present in runtime image"; exit 1; }
            echo "hardening proof OK: uid=10001, /app root-owned and unwritable, no pip/compiler"
          '

      - name: Emit SBOM and dependency inventory
        run: python scripts/generate_sbom.py --image "${IMAGE_NAME}" --output artifacts/sbom/sbom.json

      - name: Upload container evidence (digest + SBOM)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  kubernetes:
    name: kubernetes manifest validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install schema validator
        run: python -m pip install --upgrade pip kubernetes-validate pyyaml

      # Renders with `kubectl kustomize` (kubectl ships on the runner), then
      # schema-validates and asserts the hardening invariants.
      - name: Validate manifests
        run: python scripts/validate_k8s_manifests.py

  compose:
    name: compose configuration validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate the Compose stack
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm -f .env
          echo "compose config OK"
