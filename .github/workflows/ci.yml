# AegisGraph CI.
#
# Five gates, each reproducible locally (see docs/ops/ci.md for the exact
# commands): static quality, security scanning, container build + hardened smoke,
# Kubernetes manifest validation, and Compose configuration validation.
#
# Actions are pinned to immutable commit SHAs (resolved 2026-10-08) with the
# human-readable version in a trailing comment, per the M4 rules.
#
# No matrix is used: the package declares `requires-python = ">=3.12,<3.13"`, so
# there is exactly one supported interpreter minor (3.12) to cover. A matrix of
# one would add cost without adding coverage; it can be introduced when the
# support range widens.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: aegisgraph:ci
  # Coverage floor is a ratchet: it may only move up, and any lowering requires a
  # written justification in the same commit.
  #
  # Measured at commit 4350af3 (2026-10-08) on python:3.12-slim with the
  # PostgreSQL 17 service declared by the `quality` job below, so every test runs
  # except the two that need the untracked `.sentinel_reference` checkout:
  #   454 collected, 452 passed, 2 skipped -> 96.42 % (2612/2709)
  # With no database the 12 `db` tests skip and the ratio collapses to 92.80 %
  # (2514/2709), so this floor is also the guard that the `db` tests actually ran:
  # a silent skip cannot pass at 95. (Before M2 the same suite measured 94.73 % at
  # commit 33f96cc, which is why the floor was 94 then.)
  COVERAGE_FAIL_UNDER: "95"

jobs:
  quality:
    name: lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # M2's durable store is exercised by the `db`-marked tests. Without this
    # service they skip and the coverage gate fails (see COVERAGE_FAIL_UNDER).
    services:
      postgres:
        # Digest-pinned, same major version as the Compose stack.
        image: postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: aegisgraph
          POSTGRES_PASSWORD: aegisgraph
          POSTGRES_DB: aegisgraph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegisgraph -d aegisgraph_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Two names by design: `DATABASE_URL` is what the service and Alembic read,
      # `AEGISGRAPH_TEST_DATABASE_URL` is what the `db` tests look for. Credentials
      # are throwaway values scoped to this runner, never committed.
      DATABASE_URL: postgresql+psycopg://aegisgraph:aegisgraph@localhost:5432/aegisgraph_test
      AEGISGRAPH_TEST_DATABASE_URL: postgresql+psycopg://aegisgraph:aegisgraph@localhost:5432/aegisgraph_test
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the shipped pins and the dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]"
          # PyYAML is required by tests/test_benchmark_sentinel_adapter.py but is
          # not declared in the [dev] extra; adding it there is proposed in the M4
          # handoff (pyproject.toml is outside this change's write scope).
          python -m pip install pyyaml

      - name: Ruff
        run: python -m ruff check backend tests scripts

      - name: mypy (strict)
        run: python -m mypy

      - name: Apply the schema migration to the test database
        run: python -m alembic upgrade head

      - name: Assert the database suites run (not skip)
        run: |
          # `AEGISGRAPH_TEST_DATABASE_URL` is set, so these cannot skip. This names
          # a database failure explicitly instead of letting it show up only as a
          # coverage drop.
          python -m pytest -q -m db -p no:cacheprovider

      - name: pytest with coverage gate
        run: |
          # The full suite, including the `db`-marked tests.
          python -m pytest -q \
            --cov=aegisgraph \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under="${COVERAGE_FAIL_UNDER}"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

  security:
    name: dependency and static security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scanning tools
        run: python -m pip install --upgrade pip pip-audit bandit

      - name: pip-audit against the shipped pins (F8-aware, version-pinned not hash-pinned)
        run: python -m pip_audit -r requirements.lock --strict --progress-spinner off

      - name: bandit static analysis (offline)
        run: python -m bandit -r backend -q --severity-level medium

  container:
    name: container build, hardening proof and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Full history: the SBOM freshness check verifies that the manifest's
          # recorded source.commit is an ancestor of HEAD.
          fetch-depth: 0

      - name: Set up Python (for the SBOM script)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Guard: the committed SBOM must describe the lock at this revision. Runs
      # before the build so a stale manifest fails fast instead of after 25 minutes.
      - name: Check SBOM freshness against requirements.lock
        run: python scripts/check_sbom_freshness.py

      # --provenance=false --sbom=false: BuildKit's default provenance/attestation
      # manifest records build metadata, so the manifest-list digest varies between
      # builds even when the content does not. Disabling both makes the recorded
      # digest the reproducible content digest.
      - name: Build the image
        run: docker buildx build --provenance=false --sbom=false --load -t "${IMAGE_NAME}" .

      - name: Record the image digest (build artifact)
        run: |
          mkdir -p artifacts
          docker image inspect --format '{{.Id}}' "${IMAGE_NAME}" | tee artifacts/image-digest.txt
          docker image inspect --format '{{json .RepoDigests}}' "${IMAGE_NAME}" | tee artifacts/image-repo-digests.json
          docker images "${IMAGE_NAME}" --digests --no-trunc | tee artifacts/image-listing.txt

      - name: Hardened smoke test (read-only root filesystem)
        run: |
          set -euo pipefail
          # AEGISGRAPH_LEGACY_UNAUTHENTICATED=true exercises the frozen
          # development-only /v1/decision surface (M2 decision D5) with a
          # throwaway process and no database, so the smoke needs no credentials.
          # It is passed explicitly rather than relying on the development default.
          docker run --rm -d --name aegisgraph-smoke \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            -e AEGISGRAPH_LEGACY_UNAUTHENTICATED=true \
            -p 18080:8080 \
            "${IMAGE_NAME}"
          cleanup() { docker stop aegisgraph-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done

          health="$(curl -fsS http://127.0.0.1:18080/healthz)"
          test "${health}" = '{"status":"ok"}' || { echo "unexpected healthz: ${health}"; exit 1; }
          echo "healthz: ${health}"

          # M3: the Prometheus surface is on by default in development.
          metrics_status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/metrics)"
          test "${metrics_status}" = "200" || { echo "unexpected /metrics status: ${metrics_status}"; exit 1; }
          curl -fsS http://127.0.0.1:18080/metrics | grep -q '^# TYPE ' \
            || { echo "/metrics returned no exposition"; exit 1; }
          echo "metrics: HTTP ${metrics_status}"

          decision="$(curl -fsS -X POST http://127.0.0.1:18080/v1/decision \
            -H 'Content-Type: application/json' \
            --data-binary '{"run_id":"ci-smoke","step_id":1,"user_goal":"Perform the requested safe task","conversation":[],"candidate_action":{"type":"respond","content":"Done"},"policy_context":{"policy_id":"ci","policy_version":"1","allowed_tools":[],"confirmation_required_tools":[],"consequential_tools":[]},"history_digest":{"confirmations_granted":[]}}')"
          echo "decision: ${decision}"
          python - "${decision}" <<'PY'
          import json, sys
          body = json.loads(sys.argv[1])
          assert body["decision"] == "allow", body
          assert body["reason_codes"] == ["BENIGN_ACTION"], body
          print("decision asserted: allow / BENIGN_ACTION")
          PY

      - name: Hardening proof (non-root, no writable application code, no toolchain)
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "${IMAGE_NAME}" -c '
            test "$(id -u)" = "10001" || { echo "not running as uid 10001"; exit 1; }
            test "$(stat -c %U /app)" = "root" || { echo "/app is not root-owned"; exit 1; }
            touch /app/breach 2>/dev/null && { echo "F10 REGRESSION: /app is writable"; exit 1; }
            touch /app/backend/aegisgraph/breach.py 2>/dev/null && { echo "F10 REGRESSION"; exit 1; }
            command -v pip >/dev/null 2>&1 && { echo "pip present in runtime image"; exit 1; }
            command -v gcc >/dev/null 2>&1 && { echo "compiler present in runtime image"; exit 1; }
            echo "hardening proof OK: uid=10001, /app root-owned and unwritable, no pip/compiler"
          '

      - name: Emit SBOM and dependency inventory
        run: python scripts/generate_sbom.py --image "${IMAGE_NAME}" --output artifacts/sbom/sbom.json

      - name: Upload container evidence (digest + SBOM)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  kubernetes:
    name: kubernetes manifest validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install schema validators
        run: |
          python -m pip install --upgrade pip kubernetes-validate pyyaml
          # Pinned, checksum-verified kubeconform (scripts/install_kubeconform.py).
          python scripts/install_kubeconform.py --dest "${RUNNER_TEMP}/kubeconform"
          echo "${RUNNER_TEMP}/kubeconform" >> "${GITHUB_PATH}"

      # Renders with `kubectl kustomize` (kubectl ships on the runner), then runs
      # BOTH schema validators and asserts the hardening invariants.
      - name: Validate manifests
        run: python scripts/validate_k8s_manifests.py --validator both

  compose:
    name: compose configuration validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate the Compose stack
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm -f .env
          echo "compose config OK"
