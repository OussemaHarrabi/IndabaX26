[alembic]
script_location = backend/migrations
prepend_sys_path = backend
path_separator = os
version_path_separator = os
timezone = UTC

# The database URL is taken from the environment at run time (AEGISGRAPH_*), never
# committed. `alembic upgrade head` reads DATABASE_URL through backend/migrations/env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
